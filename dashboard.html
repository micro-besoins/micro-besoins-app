<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord · MicroBesoin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1769e0; --navy: #17243b; --bg: #f4f8ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--navy);
        }
        .card {
            background: #fff;
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(23, 36, 59, 0.14);
            text-align: center;
            max-width: 460px;
        }
        .check {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: #e9f8ef;
            color: #1f9d55;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; margin: 0 auto 20px;
        }
        h1 { font-size: 1.6rem; margin-bottom: 10px; }
        p { color: #6977a0; margin-bottom: 24px; }
        a {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            padding: 13px 24px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">&#10003;</div>
        <h1>Connexion réussie</h1>
        <p>Vous êtes maintenant connecté à votre espace MicroBesoin.</p>
        <a href="index.html">Se déconnecter</a>
    </div>
</body>
</html>
