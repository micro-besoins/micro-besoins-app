<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion · MicroBesoin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-page">

        <!-- Panneau gauche : dégradé bleu avec message d'accueil -->
        <section class="brand-panel" aria-hidden="true">
            <div class="brand-panel__content">
                <div class="brand-logo brand-logo--light">
                    <span class="brand-logo__mark">M</span>
                    <span class="brand-logo__name">MicroBesoin</span>
                </div>
                <h2 class="brand-panel__title">Bienvenue sur MicroBesoin</h2>
                <p class="brand-panel__text">
                    Gérez simplement vos besoins et coordonnez vos équipes.
                    Connectez-vous pour accéder à votre espace de travail.
                </p>
            </div>
        </section>

        <!-- Panneau droit : formulaire de connexion -->
        <section class="form-panel">
            <div class="form-panel__inner">

                <div class="brand-logo brand-logo--dark">
                    <span class="brand-logo__mark">M</span>
                    <span class="brand-logo__name">MicroBesoin</span>
                </div>

                <header class="form-header">
                    <h1 class="form-header__title">Se connecter</h1>
                    <p class="form-header__subtitle">Accédez à votre compte pour continuer.</p>
                </header>

                <!-- Bandeau d'erreur renvoyé par l'API / la validation -->
                <div id="api-error" class="alert alert--error" role="alert" hidden></div>

                <form id="login-form" class="login-form" novalidate>

                    <div class="form-field" data-field="email">
                        <div class="form-field__label-row">
                            <label class="form-field__label" for="email">Email</label>
                        </div>
                        <input
                            class="form-field__input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="vous@exemple.com"
                            autocomplete="email"
                            autofocus
                        >
                        <span class="form-field__underline"></span>
                        <span class="form-field__error" data-error-for="email"></span>
                    </div>

                    <div class="form-field" data-field="password">
                        <div class="form-field__label-row">
                            <label class="form-field__label" for="password">Mot de passe</label>
                            <a href="mot-de-passe-oublie.html" class="link link--forgot">Mot de passe oublié ?</a>
                        </div>
                        <div class="form-field__control">
                            <input
                                class="form-field__input"
                                type="password"
                                id="password"
                                name="password"
                                placeholder="••••••••"
                                autocomplete="current-password"
                            >
                            <button
                                type="button"
                                class="form-field__toggle"
                                id="toggle-password"
                                aria-label="Afficher le mot de passe"
                            >
                                <svg class="icon icon--eye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                        <span class="form-field__underline"></span>
                        <span class="form-field__error" data-error-for="password"></span>
                    </div>

                    <button type="submit" class="btn btn--primary" id="submit-btn">
                        <span class="btn__label">Se connecter</span>
                        <span class="btn__spinner" hidden></span>
                    </button>

                    <p class="login-form__footer">
                        Vous n'avez pas de compte ?
                        <a href="inscription.html" class="link">Inscription</a>
                    </p>
                </form>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
