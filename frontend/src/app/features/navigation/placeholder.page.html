<main>

  <div class="profile"><button type="button" class="avatar" (click)="toggleProfile()" [attr.aria-expanded]="profileOpen()" aria-label="Ouvrir le menu du profil">{{ initialsUser() }}</button><strong>{{ user()?.prenom }}</strong>@if(profileOpen()) { <div class="profile-menu"><button type="button" (click)="logout()">Se déconnecter</button></div> }</div>

    <a routerLink="/">Retour à l'exploration</a>
  </section>
</main>
