<button class="bell" type="button" (click)="openNotifications()"
  [attr.aria-label]="unreadCount() > 0 ? 'Notifications, ' + unreadCount() + ' non lues' : 'Notifications'">
  <ng-icon name="lucideBell" size="22" />
  @if (unreadCount() > 0) { <span class="badge" aria-hidden="true">{{ badge() }}</span> }
</button>
