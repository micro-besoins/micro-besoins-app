<section class="brand">
  <div class="brand-inner">
    <div class="logo" aria-hidden="true">m</div>
    <h1>{{ brand() }}</h1>
    <p class="tagline">{{ tagline() }}</p>

    <ul class="features">
      @for (f of features(); track f.title) {
        <li>
          <span class="icon">
            @switch (f.icon) {
              @case ('check') {
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
              }
              @case ('chat') {
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1 1 0 011 1v9a1 1 0 01-1 1h-8l-4 3.5V16H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>
              }
            }
          </span>
          <div>
            <strong>{{ f.title }}</strong>
            <span>{{ f.text }}</span>
          </div>
        </li>
      }
    </ul>
  </div>
</section>

<main class="content">
  <div class="content-inner"><ng-content /></div>
</main>
