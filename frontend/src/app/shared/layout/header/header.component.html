<header class="topbar">
  <a routerLink="/" class="brand">
    <span class="logo">m</span>
    <span>Micro-Besoins</span>
  </a>
  
  <nav aria-label="Navigation principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Explorer</a>
    <a routerLink="/mes-besoins" routerLinkActive="active">Mes besoins</a>
    <a routerLink="/mes-propositions" routerLinkActive="active">Mes propositions</a>
    <a routerLink="/messages" routerLinkActive="active">Messages</a>
  </nav>

  <div class="actions">
    <span class="notification" aria-label="Une notification">
      <ng-icon name="lucideBell" />
      <b>1</b>
    </span>
    <a routerLink="/publier-un-besoin" class="publish" aria-label="Publier un besoin">
      ＋ <span>Publier un besoin</span>
    </a>
    <div class="profile">
      <button class="avatar" type="button" (click)="toggleProfile()" [attr.aria-expanded]="profileOpen()" aria-label="Ouvrir le menu du profil">
        {{ initials(user()?.prenom ?? null, user()?.nom ?? null) }}
      </button>
      <strong class="user-name">{{ user()?.prenom }}</strong>
      @if (profileOpen()) {
        <div class="profile-menu">
          @if (isAdmin) {
            <button type="button" (click)="goToAdmin()">Tableau de bord</button>
          }
          <button type="button" (click)="logout()">Se déconnecter</button>
        </div>
      }
    </div>
  </div>
</header>
